name: 部署管理面板

on:
  push:
    branches: [main]
    paths:
      - 'panel/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包 panel 目录
        uses: actions/upload-pages-artifact@v3
        with:
          path: panel

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
