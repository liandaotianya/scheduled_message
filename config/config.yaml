# ============================================================
#  全局配置 —— 改参数只需要改这一个文件
#  改完提交，GitHub Actions，下次执行自动生效
# ============================================================

# ---------- 邮件 ----------
mail:
  to: "986882896@qq.com"          # 收件人，多个用英文逗号分隔
  from: "986882896@qq.com"        # 发件人（必须与 QQ 授权码所属账号一致）
  subject_prefix: ""              # 邮件主题前缀，留空则不加
  send_enabled: true              # false = 只生成结果不发信（调试用）
  # 以下两项一般不用改
  smtp_host: "smtp.qq.com"
  smtp_port: 465


# ---------- 三个任务 ----------
tasks:

  # ① 长春薅羊毛活动收集：每月双号（排除 16/30 号）17:03
  changchun_deals:
    enabled: true
    time_slot: "17:03"
    days: even                    # even=双号 / odd=单号 / special=仅 run_days
    exclude_days: [16, 30]
    min_items: 5                  # 每期最少条数，不达标会在日志里警告
    search_recent_days: 7         # 搜索时间窗口（天）
    # 品类优先级：顺序即优先级，越靠前越优先收集
    categories:
      - 云闪付抢券消费券
      - 加油优惠券
      - 工会福利
      - 亲子体验
      - 门店折扣
      - 美食餐饮
      - 景区娱乐
      - 公益文化

  # ② AI 日报：每月单号（排除 7/23 号）17:03
  ai_daily:
    enabled: true
    time_slot: "17:03"
    days: odd
    exclude_days: [7, 23]
    items_per_category: 8         # 每个分类的条数
    archive: true                 # 是否存档到 data/archive/
    categories:
      - 提高开发效率的工具
      - 可产品化开源项目
      - 近10天可落地信息差
      - 其他优质资讯
      - 日常痛点+解决方案

  # ③ 用户痛点快报：每月 7/16/23/30 号 17:03
  pain_points:
    enabled: true
    time_slot: "17:03"
    days: special
    run_days: [7, 16, 23, 30]
    total_items: 20
    # 6 大场景
    scenes:
      - 居家日用
      - 通勤出行
      - 育儿生活
      - 上班族职场
      - 养老便民
      - 日常消费餐饮


# ---------- LLM ----------
llm:
  primary: gemini                 # 主通道：gemini / deepseek
  fallback: deepseek              # 兜底通道，主通道失败/超限时自动切换
  temperature: 0.7
  max_retries: 4                  # 每个通道的重试次数（应对临时高负载 503）
  timeout: 180                    # 单次请求超时（秒）
  models:
    gemini: "gemini-3.5-flash-lite"
    deepseek: "deepseek-chat"


# ---------- 运行 ----------
runtime:
  timezone: "Asia/Shanghai"
  # 单个抓取源失败是否中断整个任务（false = 跳过该源继续）
  fail_fast_on_source_error: false
  log_level: "INFO"
